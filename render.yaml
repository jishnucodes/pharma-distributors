# Render Blueprint — Express API (Web Service)
# https://docs.render.com/blueprint-spec
services:
  - type: web
    name: lk-pharma-api
    runtime: node
    region: oregon # Change to your preferred region: oregon, ohio, frankfurt, singapore
    plan: free # Options: free, starter, standard, pro
    buildCommand: npm install && npm run db:generate && npm run build:api
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000" # Render uses port 10000 by default for web services
      - key: DATABASE_URL
        sync: false # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true # Auto-generates a random secret
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: CORS_ORIGIN
        sync: false # Set to your Vercel frontend URL after deploying
      - key: API_BASE_URL
        sync: false # Set to your Render service URL after deploying
